<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Blackwell og Vera Rubin sammenlignet på fire ulike mål</title><desc id="desc">Fire separate stolpediagrammer viser NVIDIAs publiserte tall for kostnad per token, GPU-behov til MoE-trening, minnebåndbredde og NVLink-båndbredde.</desc>
  <rect width="1600" height="1000" fill="#f5f1e9"/><rect width="1600" height="196" fill="#07151d"/>
  <text x="88" y="78" fill="#d2ab67" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="3">BLACKWELL → VERA RUBIN</text><text x="88" y="137" fill="#ffffff" font-family="Georgia, serif" font-size="48">Fire mål for generasjonsspranget</text><text x="1512" y="79" fill="#ffffff" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="19">NVIDIA-opplysninger · oppgaveavhengige</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="234" width="720" height="310" rx="8" fill="#ffffff" stroke="#d8d1c5"/><text x="100" y="284" fill="#07151d" font-size="26" font-weight="700">Kostnad per AI-token</text><text x="100" y="318" fill="#6b7280" font-size="18">Indeks · Blackwell = 100 · lavere er bedre</text><text x="100" y="375" fill="#374151" font-size="19" font-weight="700">Blackwell</text><rect x="260" y="350" width="448" height="34" rx="4" fill="#6b7280"/><text x="724" y="375" fill="#374151" font-size="19">100</text><text x="100" y="438" fill="#374151" font-size="19" font-weight="700">Vera Rubin</text><rect x="260" y="413" width="45" height="34" rx="4" fill="#9e1b4d"/><text x="321" y="438" fill="#9e1b4d" font-size="19" font-weight="700">ned til 10</text><text x="100" y="500" fill="#07151d" font-size="28" font-weight="700">Opptil 10× lavere tokenkostnad</text>
    <rect x="816" y="234" width="720" height="310" rx="8" fill="#ffffff" stroke="#d8d1c5"/><text x="852" y="284" fill="#07151d" font-size="26" font-weight="700">GPU-behov til MoE-trening</text><text x="852" y="318" fill="#6b7280" font-size="18">Indeks · Blackwell = 100 · lavere er bedre</text><text x="852" y="375" fill="#374151" font-size="19" font-weight="700">Blackwell</text><rect x="1012" y="350" width="448" height="34" rx="4" fill="#6b7280"/><text x="1476" y="375" fill="#374151" font-size="19">100</text><text x="852" y="438" fill="#374151" font-size="19" font-weight="700">Vera Rubin</text><rect x="1012" y="413" width="112" height="34" rx="4" fill="#9e1b4d"/><text x="1140" y="438" fill="#9e1b4d" font-size="19" font-weight="700">25</text><text x="852" y="500" fill="#07151d" font-size="28" font-weight="700">4× færre GPU-er</text>
    <rect x="64" y="574" width="720" height="310" rx="8" fill="#ffffff" stroke="#d8d1c5"/><text x="100" y="624" fill="#07151d" font-size="26" font-weight="700">HBM-minnebåndbredde</text><text x="100" y="658" fill="#6b7280" font-size="18">TB/s per GPU · høyere er bedre</text><text x="100" y="715" fill="#374151" font-size="19" font-weight="700">Blackwell</text><rect x="260" y="690" width="131" height="34" rx="4" fill="#6b7280"/><text x="407" y="715" fill="#374151" font-size="19">8 TB/s</text><text x="100" y="778" fill="#374151" font-size="19" font-weight="700">Vera Rubin</text><rect x="260" y="753" width="360" height="34" rx="4" fill="#9e1b4d"/><text x="636" y="778" fill="#9e1b4d" font-size="19" font-weight="700">opptil 22 TB/s</text><text x="100" y="840" fill="#07151d" font-size="28" font-weight="700">Nesten 3× større båndbredde</text>
    <rect x="816" y="574" width="720" height="310" rx="8" fill="#ffffff" stroke="#d8d1c5"/><text x="852" y="624" fill="#07151d" font-size="26" font-weight="700">NVLink-båndbredde</text><text x="852" y="658" fill="#6b7280" font-size="18">TB/s per GPU, toveis · høyere er bedre</text><text x="852" y="715" fill="#374151" font-size="19" font-weight="700">Blackwell</text><rect x="1012" y="690" width="180" height="34" rx="4" fill="#6b7280"/><text x="1208" y="715" fill="#374151" font-size="19">1,8 TB/s</text><text x="852" y="778" fill="#374151" font-size="19" font-weight="700">Vera Rubin</text><rect x="1012" y="753" width="360" height="34" rx="4" fill="#9e1b4d"/><text x="1388" y="778" fill="#9e1b4d" font-size="19" font-weight="700">3,6 TB/s</text><text x="852" y="840" fill="#07151d" font-size="28" font-weight="700">2× større GPU-til-GPU-båndbredde</text>
    <text x="64" y="928" fill="#374151" font-size="18">Hvert panel har sin egen skala og enhet. Tallene skal ikke legges sammen til ett samlet «krafttall».</text><text x="64" y="962" fill="#6b7280" font-size="16">Kilder: NVIDIA, 5. januar 2026 · NVIDIA Technical Blog, 5. januar 2026. «Opptil» og resultater varierer med modell, programvare og arbeidsbelastning.</text><text x="1536" y="962" fill="#07151d" text-anchor="end" font-size="17" font-weight="700">WALTHAM CONSULTING</text>
  </g>
</svg>
