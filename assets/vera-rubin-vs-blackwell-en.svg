<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Blackwell and Vera Rubin compared across four separate measures</title><desc id="desc">Four separate bar charts show NVIDIA's published figures for token cost, GPUs needed for MoE training, memory bandwidth and NVLink bandwidth.</desc>
  <rect width="1600" height="1000" fill="#f5f1e9"/><rect width="1600" height="196" fill="#07151d"/>
  <text x="88" y="78" fill="#d2ab67" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="3">BLACKWELL → VERA RUBIN</text><text x="88" y="137" fill="#ffffff" font-family="Georgia, serif" font-size="48">Four measures of the generational leap</text><text x="1512" y="79" fill="#ffffff" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="19">NVIDIA figures · workload-dependent</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="234" width="720" height="310" rx="8" fill="#ffffff" stroke="#d8d1c5"/><text x="100" y="284" fill="#07151d" font-size="26" font-weight="700">Cost per AI token</text><text x="100" y="318" fill="#6b7280" font-size="18">Index · Blackwell = 100 · lower is better</text><text x="100" y="375" fill="#374151" font-size="19" font-weight="700">Blackwell</text><rect x="260" y="350" width="448" height="34" rx="4" fill="#6b7280"/><text x="724" y="375" fill="#374151" font-size="19">100</text><text x="100" y="438" fill="#374151" font-size="19" font-weight="700">Vera Rubin</text><rect x="260" y="413" width="45" height="34" rx="4" fill="#9e1b4d"/><text x="321" y="438" fill="#9e1b4d" font-size="19" font-weight="700">as low as 10</text><text x="100" y="500" fill="#07151d" font-size="28" font-weight="700">Up to 10× lower token cost</text>
    <rect x="816" y="234" width="720" height="310" rx="8" fill="#ffffff" stroke="#d8d1c5"/><text x="852" y="284" fill="#07151d" font-size="26" font-weight="700">GPUs needed for MoE training</text><text x="852" y="318" fill="#6b7280" font-size="18">Index · Blackwell = 100 · lower is better</text><text x="852" y="375" fill="#374151" font-size="19" font-weight="700">Blackwell</text><rect x="1012" y="350" width="448" height="34" rx="4" fill="#6b7280"/><text x="1476" y="375" fill="#374151" font-size="19">100</text><text x="852" y="438" fill="#374151" font-size="19" font-weight="700">Vera Rubin</text><rect x="1012" y="413" width="112" height="34" rx="4" fill="#9e1b4d"/><text x="1140" y="438" fill="#9e1b4d" font-size="19" font-weight="700">25</text><text x="852" y="500" fill="#07151d" font-size="28" font-weight="700">4× fewer GPUs</text>
    <rect x="64" y="574" width="720" height="310" rx="8" fill="#ffffff" stroke="#d8d1c5"/><text x="100" y="624" fill="#07151d" font-size="26" font-weight="700">HBM memory bandwidth</text><text x="100" y="658" fill="#6b7280" font-size="18">TB/s per GPU · higher is better</text><text x="100" y="715" fill="#374151" font-size="19" font-weight="700">Blackwell</text><rect x="260" y="690" width="131" height="34" rx="4" fill="#6b7280"/><text x="407" y="715" fill="#374151" font-size="19">8 TB/s</text><text x="100" y="778" fill="#374151" font-size="19" font-weight="700">Vera Rubin</text><rect x="260" y="753" width="360" height="34" rx="4" fill="#9e1b4d"/><text x="636" y="778" fill="#9e1b4d" font-size="19" font-weight="700">up to 22 TB/s</text><text x="100" y="840" fill="#07151d" font-size="28" font-weight="700">Nearly 3× the bandwidth</text>
    <rect x="816" y="574" width="720" height="310" rx="8" fill="#ffffff" stroke="#d8d1c5"/><text x="852" y="624" fill="#07151d" font-size="26" font-weight="700">NVLink bandwidth</text><text x="852" y="658" fill="#6b7280" font-size="18">TB/s per GPU, bidirectional · higher is better</text><text x="852" y="715" fill="#374151" font-size="19" font-weight="700">Blackwell</text><rect x="1012" y="690" width="180" height="34" rx="4" fill="#6b7280"/><text x="1208" y="715" fill="#374151" font-size="19">1.8 TB/s</text><text x="852" y="778" fill="#374151" font-size="19" font-weight="700">Vera Rubin</text><rect x="1012" y="753" width="360" height="34" rx="4" fill="#9e1b4d"/><text x="1388" y="778" fill="#9e1b4d" font-size="19" font-weight="700">3.6 TB/s</text><text x="852" y="840" fill="#07151d" font-size="28" font-weight="700">2× GPU-to-GPU bandwidth</text>
    <text x="64" y="928" fill="#374151" font-size="18">Each panel has its own scale and unit. The figures should not be combined into one overall “power score”.</text><text x="64" y="962" fill="#6b7280" font-size="16">Sources: NVIDIA, 5 January 2026 · NVIDIA Technical Blog, 5 January 2026. “Up to” results vary by model, software and workload.</text><text x="1536" y="962" fill="#07151d" text-anchor="end" font-size="17" font-weight="700">WALTHAM CONSULTING</text>
  </g>
</svg>
