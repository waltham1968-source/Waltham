name: AI Visibility tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  visibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/*.test.mjs
      - run: python3 scripts/check-localized-pages.py
